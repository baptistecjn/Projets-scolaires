server {
    listen 80;
    server_name baptiste.istic.univ-rennes1.fr 148.60.11.90; 

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name baptiste.istic.univ-rennes1.fr 148.60.11.90;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location = / {
	auth_basic "Zone Restreinte ESIR";
        auth_basic_user_file /etc/nginx/.htpasswd;

        root /home/baptiste/esir-as-a-service-2025/pages;
        
        index index.html;
        try_files $uri $uri/ =404;    }
    
    location / {
        root /home/baptiste/esir-as-a-service-2025/pages;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Gitea
    location /gitea/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Nextcloud
    location /nextcloud/ {
	proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # RocketChat
    location /rocketchat/ {
	proxy_pass http://127.0.0.1:3003;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	
    }

    location /rocketchat/api/ {
        rewrite ^/rocketchat/api/(.*) /api/$1 break;
        
        proxy_pass http://127.0.0.1:3003;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

 
    # Wordpress
    location /wordpress/ {
	auth_basic "Acces Restreint WordPress";
	auth_basic_user_file /etc/nginx/.htpasswd;
	
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Memos
    location /memos/ {
        proxy_pass http://127.0.0.1:5230/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

	sub_filter_once off;
	sub_filter 'href="/' 'href="/memos/';
	sub_filter 'src="/' 'src="/memos/';
    }



    # Keepass
    location /keepass/ {
       proxy_pass http://127.0.0.1:3004/;
        
       rewrite ^/keepass/(.*) /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        sub_filter_once off;
        sub_filter 'href="/' 'href="/keepass/';
        sub_filter 'src="/' 'src="/keepass/';
     
        sub_filter 'path: \'' 'path: \'/keepass'; 
    }

    # Adminer
    location /adminer/ {
        proxy_pass http://127.0.0.1:8085/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Gatus
server {
    listen 443 ssl;
    server_name gatus.baptiste.istic.univ-rennes1.fr;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    location / {
        proxy_pass http://127.0.0.1:3007;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
