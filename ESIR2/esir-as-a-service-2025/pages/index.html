<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portail d'applications</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e1e, #3d3d3d);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            color: #504DB3;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background-color: rgba(50, 50, 70, 0.7);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .card:hover {
            transform: translateY(-5px);
            background-color: rgba(70, 70, 100, 0.9);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .card span {
            display: block;
            margin-top: 10px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .nextcloud { background-color: #3a5f7d; }
        .memos { background-color: #4a658d; }
        .keepassxc { background-color: #556f9e; }
        .gitea { background-color: #6079af; }
        .rocket { background-color: #6b84c0; }
        .wordpress { background-color: #768fd1; }
        .kuma { background-color: #819ae2; }
	.admirer { background-color: #819ae2; }

        .card svg {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            fill: white;
        }
    </style>
</head>
<body>
    <h1>Portail de mes applications</h1>
    <div class="grid">
        <a href="https://baptiste.istic.univ-rennes1.fr/nextcloud" target="_blank" class="card nextcloud">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
            Nextcloud
            <span>Stockage et partage de fichiers</span>
        </a>
        <a href="https://baptiste.istic.univ-rennes1.fr/memos" target="_blank" class="card memos">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14l4-4h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            Memos
            <span>Prise de notes rapide</span>
        </a>
        <a href="https://baptiste.istic.univ-rennes1.fr/keepass" target="_blank" class="card keepassxc">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7v6c0 5 4 9 10 9s10-4 10-9V7l-10-5z"/></svg>
            KeepassXC Web
            <span>Gestion de mots de passe</span>
        </a>
        <a href="https://baptiste.istic.univ-rennes1.fr/gitea" target="_blank" class="card gitea">
            <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>
            Gitea
            <span>Dépôts Git locaux</span>
        </a>
        <a href="https://baptiste.istic.univ-rennes1.fr/rocketchat" target="_blank" class="card rocket">
            <svg viewBox="0 0 24 24"><path d="M2 22l2-6 16-4-3 6-15 4z"/></svg>
            Rocket.Chat
            <span>Messagerie d’équipe</span>
        </a>
        <a href="https://baptiste.istic.univ-rennes1.fr/wordpress" target="_blank" class="card wordpress">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
            WordPress
            <span>Site web / Blog</span>
        </a>
        <a href="https://gatus.baptiste.istic.univ-rennes1.fr/" target="_blank" class="card kuma">
            <svg viewBox="0 0 24 24"><path d="M12 4C8 4 4 8 4 12s4 8 8 8 8-4 8-8-4-8-8-8z"/></svg>
            Gatus
            <span>Monitoring des services</span>
        </a>
        <a href="https://baptiste.istic.univ-rennes1.fr/adminer" target="_blank" class="card admirer">
            <svg viewBox="0 0 24 24"><path d="M12 4C8 4 4 8 4 12s4 8 8 8 8-4 8-8-4-8-8-8z"/></svg>
            Admirer
            <span>Base de données des services</span>
        </a>

    </div>
</body>
</html>
