<div class="register-container">
    <div class="register-card">
        <h2>Créer un compte</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Prénom</label>
                <input type="text" name="firstname" [(ngModel)]="form.firstname" placeholder="Ex: Jean">
            </div>
            <div class="form-group">
                <label>Nom</label>
                <input type="text" name="lastname" [(ngModel)]="form.lastname" placeholder="Ex: Dupont">
            </div>
        </div>

        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" [(ngModel)]="form.age" placeholder="Votre âge">
        </div>

        <div class="form-group">
            <label>Identifiant (Username)</label>
            <input type="text" name="username" [(ngModel)]="form.username" placeholder="Choisissez un pseudo">
        </div>

        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="password" [(ngModel)]="form.password" placeholder="••••••••">
        </div>

        <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

        <button class="btn-submit" (click)="onSubmit()">S'inscrire</button>

        <div class="login-link">
            Déjà un compte ?
            <span (click)="goToLogin()"
                style="cursor: pointer; color: #6c0d8e; font-weight: bold; text-decoration: underline;">
                Se connecter
            </span>
        </div>
    </div>
</div>
